sentence=Un PID entero de punta a punta, dueño de su propio estado y de su propia reconfiguración.
paragraph=Sólo de cabecera. Las ganancias son por muestra y no por segundo, que es lo que hace la aritmética, así que cada escala queda como constante de tiempo de compilación y la tabla del enlace publica el formato desde el tipo que lo define. Lleva la integración condicional y una cota del integrador que se recalcula sola cuando cambia ki. Y se hace cargo de cuándo olvidar la historia: configure() mira el modo y la magnitud realimentada, porque el integrador acumula en las unidades de esa magnitud. LoopAngle, LoopCurrent y LoopDrive le agregan al ángulo, a la corriente y al puente lo que sólo un lazo necesita --un cero, un signo, un filtro, cuentas enteras, la frecuencia del PWM-- sin cargárselo a quien no cierra un lazo.
