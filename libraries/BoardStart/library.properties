sentence=Lo que hay que hacer antes de que el sketch pueda confiar en el hardware: el reloj y el bus I2C.
paragraph=Solo de cabecera, dos funciones. boardClockBegin() deja la placa en los 16 MHz para los que se compilo el sketch: un UNO con cristal ya esta ahi, un clon con LGT8F328P arranca a 4 MHz y entonces ni el puerto serie puede avisarlo. i2cBusRecover() destraba el bus cuando un reset a destiempo dejo al esclavo sujetando SDA, que es lo que pasa cada vez que se graba la placa en medio de una lectura y se ve como cero muestras y un desborde por tick.
category=Device Control
architectures=avr
