name=BoardStart
version=0.1.0
author=Nicolas L. Bertolo
maintainer=Nicolas L. Bertolo
sentence=Lo que hay que hacer antes de que el sketch pueda confiar en el hardware: el reloj, el ADC y el bus I2C.
paragraph=Sólo de cabecera. board::clock_begin() deja la placa en los 16 MHz para los que se compiló el sketch: un UNO con cristal ya está ahí, y un clon con LGT8F328P arranca a 4 MHz, con lo que ni el puerto serie puede informarlo. board::adc_full_scale() distingue el ADC de 10 bits del UNO del de 12 bits del clon, y board::adc_select_vcc() deja el ADC midiendo contra Vcc en las dos placas. board::bus_recover() destraba el bus cuando un reset a destiempo dejó al esclavo sujetando SDA, lo que ocurre si se graba la placa en medio de una lectura y se ve como cero muestras y un desborde por tick.
category=Device Control
architectures=avr
