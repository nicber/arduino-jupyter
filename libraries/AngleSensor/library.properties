sentence=Un angulo de una vuelta convertido en una posicion que un lazo puede usar, y lo que hay que saber para creerle al sensor.
paragraph=Solo de cabecera. AngleTracker recibe el angulo por update() y no sabe de que sensor viene ni si alguien lo corrigio: referencia a un cero elegido, desenrolla para que no salte al dar la vuelta, y filtra. SensorHealth separa las dos formas que tiene un dato de salud, porque no se tratan igual: las cuentas son totales acumulados que la computadora puede poner en cero, y los estados son lecturas de ahora que ponerlas en cero seria inventarlas.
