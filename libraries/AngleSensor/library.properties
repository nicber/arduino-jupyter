sentence=Un ángulo de una vuelta convertido en una posición que un lazo puede usar, y lo que hace falta saber para validar las lecturas del sensor.
paragraph=Sólo de cabecera. AngleTracker recibe la cuenta por update() y no sabe de qué sensor viene ni si alguien la corrigió: la desenrolla para que no salte al dar la vuelta, y nada más; no filtra, no elige un cero ni invierte el signo. SensorHealth separa las dos formas que tiene un dato de salud, porque no se tratan igual: las cuentas son totales acumulados que la computadora puede poner en cero, y los estados son lecturas actuales, que no se ponen en cero porque eso sería inventarlas.
