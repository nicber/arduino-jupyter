sentence=La corrección del error de ángulo de un sensor de una vuelta, como una tabla indexada por el ángulo crudo.
paragraph=Sólo de cabecera y aritmética entera nada más, así que se compila y se prueba en la máquina de escritorio. AngleLut guarda la corrección en octavos de cuenta e interpola linealmente entre las dos entradas que rodean al ángulo. La tabla se carga de a una entrada por escritura de parámetro, así que cargarla no le agrega ningún comando al protocolo. Quien la calcula es la computadora: acá vive nada más que la corrección.
