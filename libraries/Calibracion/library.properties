sentence=La correccion del error de angulo de un sensor de una vuelta, como una tabla indexada por el angulo crudo.
paragraph=Solo de cabecera y aritmetica entera nada mas, asi que se compila y se prueba en la maquina de escritorio. AngleLut guarda la correccion en octavos de cuenta e interpola linealmente entre las dos entradas que rodean al angulo. La tabla se carga de a una entrada por escritura de parametro, asi que cargarla no le agrega ningun comando al protocolo. Quien la calcula es la computadora: aca vive nada mas que la correccion.
