sentence=El reloj de un lazo de control: muestreo de período rígido y un divisor que decide cada cuántas muestras corre la ley.
paragraph=Sólo de cabecera. SampleClock se queda con el Timer2 y no sabe nada de qué se muestrea: quien lo use pone en la ISR lo que haya que muestrear y le pregunta si además vence un período de control. Ese reparto es el punto del módulo, porque el muestreo mantiene su período aunque el cálculo fluctúe, y lo que fluctúa queda medido en lugar de perderse.
