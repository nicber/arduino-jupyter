sentence=El reloj de un lazo de control: muestreo de periodo rigido y un divisor que decide cada cuantas muestras corre la ley.
paragraph=Solo de cabecera. SampleClock se queda con el Timer2 y no sabe nada de que se muestrea: quien lo use pone en la ISR lo que haya que muestrear y le pregunta si ademas vence un periodo de control. Ese reparto es el punto del modulo, porque el muestreo mantiene su periodo aunque el calculo fluctue, y lo que fluctua queda medido en lugar de perderse.
