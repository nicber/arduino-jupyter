sentence=Un puente en H con la magnitud modulada por PWM y el sentido en dos salidas digitales.
paragraph=Sólo de cabecera. HBridge<Ena, In1, In2> toma los pines como parámetros de plantilla, así que quedan fijados en tiempo de compilación, y se queda con el Timer1 para modular con un TOP propio. Un cambio de sentido nunca atraviesa un estado conduciendo, porque baja la habilitación antes de tocar las entradas de sentido. Sirve también para un transistor gobernado desde la habilitación.
