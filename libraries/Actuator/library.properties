sentence=Un puente en H con la magnitud modulada por PWM y el sentido en dos salidas digitales.
paragraph=Solo de cabecera. HBridge<Ena, In1, In2> toma los pines como parametros de plantilla, asi que las escrituras se resuelven en tiempo de compilacion, y se queda con el Timer1 para poder modular con un TOP propio: la frecuencia del PWM pasa a ser un parametro en lugar de un modo fijo. Un cambio de sentido nunca atraviesa un estado conduciendo, porque baja la habilitacion antes de tocar las entradas de sentido.
