sentence=Asynchronous AS5600 magnetic angle sensor reader for fast poll loops.
paragraph=Header-only template class that samples the AS5600 RAW ANGLE register over an interrupt-driven I2C bus, suitable for a 5 kHz timer-driven loop on an Arduino UNO. Bus access is a static-dispatch policy; an adapter for nI2C is included.
