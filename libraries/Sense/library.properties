sentence=Una corriente con sentido a partir de cuentas crudas de un conversor.
paragraph=Solo de cabecera. CurrentSense resta el cero a una cuenta cruda y no toca el conversor. RowAdc corre el ADC libre y promedia todas las conversiones de cada periodo del lazo, que es lo que hace falta para medir la media de una corriente con PWM. WindowMean promedia varios periodos, SupplyRatio mide la corriente contra la alimentacion del sensor con un divisor en otro canal y MainsNotch saca la red con dos notch alrededor de cada armonico. Todo menos RowAdc es aritmetica pura y se prueba en la maquina de escritorio.
