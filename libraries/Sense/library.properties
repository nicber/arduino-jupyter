paragraph=Solo de cabecera. CurrentSense recibe la cuenta por update() y no toca el conversor ni sabe cual es, asi que queda entero del lado de la aritmetica y se prueba en la maquina de escritorio, que es donde un error de signo se encuentra en un segundo en lugar de en un banco. Sabe las dos cosas que convierten una cuenta en una corriente con sentido: donde esta el cero del sensor y si el sensor esta insertado al reves.
