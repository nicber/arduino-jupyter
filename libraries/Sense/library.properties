sentence=Una corriente con sentido a partir de cuentas crudas de un conversor.
paragraph=Sólo de cabecera. CurrentSense resta el cero a una cuenta cruda y no toca el conversor. RowAdc encadena las conversiones del ADC una tras otra: cada interrupción lee la suya, elige el canal de la siguiente y recién ahí la arranca, así que cada conversión es del canal que dice. Promedia todas las de cada período del lazo, que es lo que hace falta para medir la media de una corriente con PWM, y puede pasar antes cada tick por una media móvil (MovingAverage, de ControlMath). WindowMean promedia varios períodos, SupplyRatio mide la corriente contra la alimentación del sensor con un divisor en otro canal y MainsNotch saca la red con dos notch alrededor de cada armónico, y lo que queda del PWM con otro en el Nyquist de las filas, 250 Hz con filas a 500 Hz. Todo menos RowAdc es aritmética pura y se prueba en la máquina de escritorio.
