sentence=Aritmetica de punto fijo y filtros enteros, con plantillas, para lazos de control sobre AVR.
paragraph=Solo de cabecera. Fixed<Raw, Frac> pone el formato Q en el tipo, asi que toda conversion de escala se resuelve en tiempo de compilacion y una ley de control se puede escribir sin un solo float. FirstOrderFilter es un IIR de un polo construido sobre eso, con bits de guarda en el estado, de modo que no se estanca ni entra en ciclo limite como lo hace un filtro entero ingenuo.
