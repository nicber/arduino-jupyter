sentence=Templated fixed-point arithmetic and integer filters for AVR control loops.
paragraph=Header-only. Fixed<Raw, Frac> puts the Q format in the type, so every scale conversion folds at compile time and a control law can be written without a single float. FirstOrderFilter is a one-pole IIR built on it, with guard bits in the state so it neither stalls nor limit-cycles the way a naive integer filter does.
