sentence=Aritmetica de punto fijo y filtros enteros, con plantillas, para lazos de control sobre AVR.
paragraph=Sólo de cabecera. Fixed<Raw, Frac> pone el formato Q en el tipo, así que toda conversión de escala se resuelve en tiempo de compilación y una ley de control se puede escribir sin un solo float. FirstOrderFilter es un IIR de un polo construido sobre eso, con bits de guarda en el estado, de modo que no se estanca ni entra en ciclo límite como lo hace un filtro entero ingenuo. MovingAverage es una media móvil de N muestras sobre un buffer circular con la suma corrida: dos operaciones por muestra, y la división que la cierra resuelta en tiempo de compilación.
