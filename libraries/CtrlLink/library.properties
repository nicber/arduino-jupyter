sentence=Protocolo de telemetría y parámetros, orientado a líneas, entre un lazo de control en Arduino y un notebook de Jupyter.
paragraph=Emite filas de telemetría en hexadecimal de ancho fijo a hasta 1 Mbaud mientras acepta comandos ASCII por el mismo puerto. Los parámetros ajustables y los canales de telemetría se declaran como tablas en PROGMEM, y la computadora descubre ambos en tiempo de ejecución, así que agregar una ganancia al sketch no exige cambio alguno del lado de Python.
