sentence=Line-oriented telemetry and parameter protocol between an Arduino control loop and a Jupyter notebook.
paragraph=Streams fixed-width hex telemetry rows at up to 1 Mbaud while accepting ASCII commands on the same port. Tunable parameters and telemetry channels are declared as PROGMEM tables, and the host discovers both at runtime, so adding a gain to the sketch needs no change on the Python side.
