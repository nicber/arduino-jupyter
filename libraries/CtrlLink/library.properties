name=CtrlLink
version=0.1.0
author=Nicolas L. Bertolo
maintainer=Nicolas L. Bertolo
sentence=Protocolo de telemetria y parametros, orientado a lineas, entre un lazo de control en Arduino y un notebook de Jupyter.
paragraph=Emite filas de telemetria en hexadecimal de ancho fijo a hasta 1 Mbaud mientras acepta comandos ASCII por el mismo puerto. Los parametros ajustables y los canales de telemetria se declaran como tablas en PROGMEM, y la computadora descubre ambos en tiempo de ejecucion, asi que agregar una ganancia al sketch no exige cambio alguno del lado de Python.
