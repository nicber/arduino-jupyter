sentence=El mapa de registros del AS5600, tal como lo declara la hoja de datos, sin ningun transporte.
paragraph=Solo de cabecera, y a proposito sin ninguna dependencia. Lo necesitan dos clases de codigo que no pueden compartir un driver: un lazo que habla por un bus asincronico desde una ISR, y una puesta en marcha que habla por Wire y bloquea porque no tiene ningun plazo que cumplir. Si los numeros vivieran adentro del driver asincronico, incluirlos arrastraria su bus y su vector de interrupcion, que choca con el de Wire. Lo que se comparte son los numeros de la hoja de datos, no el transporte.
