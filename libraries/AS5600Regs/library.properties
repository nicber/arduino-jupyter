sentence=El mapa de registros del AS5600, tal como lo declara la hoja de datos, sin ningún transporte.
paragraph=Sólo de cabecera, y a propósito sin ninguna dependencia. Lo necesitan dos clases de código que no pueden compartir un driver: un lazo que habla por un bus asincrónico desde una ISR, y una puesta en marcha que habla por Wire y bloquea porque no tiene ningún plazo que cumplir. Si los números vivieran adentro del driver asincrónico, incluirlos arrastraría su bus y su vector de interrupción, que choca con el de Wire. Lo que se comparte son los números de la hoja de datos, no el transporte.
